<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Rakha Hayya Portfolio</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--muted:#94a3b8;--accent:#3b82f6;--danger:#ef4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8fafc;font-family:Segoe UI,Arial,sans-serif}
.wrap{max-width:1100px;margin:30px auto;padding:20px}.card{background:var(--card);border-radius:14px;padding:24px;margin-bottom:20px;box-shadow:0 10px 30px #0006}
h1,h2{margin-top:0}input,button{font:inherit}input{width:100%;padding:11px;border:1px solid #475569;border-radius:7px;background:#0f172a;color:#fff;margin:6px 0 12px}
button{border:0;border-radius:7px;padding:10px 14px;cursor:pointer;background:var(--accent);color:#fff;font-weight:700;margin:4px}.danger{background:var(--danger)}.muted{color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.item{border:1px solid #334155;border-radius:10px;padding:14px;margin:10px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.preview{max-width:150px;max-height:90px;object-fit:cover;border-radius:6px;margin:5px 0}
@media(max-width:700px){.row{grid-template-columns:1fr}}
#app{display:none}.status{padding:10px;border-radius:7px;background:#0b1120;margin:10px 0}
</style>
</head>
<body><div class="wrap">
<div id="login" class="card">
<h1>Admin Portfolio</h1><p class="muted">Login untuk mengelola sertifikat dan liputan media.</p>
<form id="loginForm"><input id="password" type="password" placeholder="Password admin" required><button>Login</button></form>
<div id="loginMsg" class="muted"></div>
</div>
<div id="app">
<div class="card"><div class="toolbar"><h1 style="margin-right:auto">Content Manager</h1><button onclick="addCert()">+ Sertifikat</button><button onclick="addNews()">+ Berita</button><button onclick="saveAll()">Simpan Semua</button><button class="danger" onclick="logout()">Logout</button></div><div id="status" class="status">Memuat...</div></div>
<div class="card"><h2>Sertifikat</h2><div id="certs"></div></div>
<div class="card"><h2>Liputan Media & Berita</h2><div id="news"></div></div>
</div></div>
<script>
let data={certificates:[],news:[]};
const $=id=>document.getElementById(id);
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request gagal');return j}
async function login(e){e.preventDefault();try{await api('/api/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('login').style.display='none';$('app').style.display='block';await load()}catch(x){$('loginMsg').textContent=x.message}}
$('loginForm').onsubmit=login;
async function load(){try{data=await api('/api/content');render();$('status').textContent='Siap. Perubahan baru tersimpan setelah klik "Simpan Semua".'}catch(x){$('status').textContent=x.message}}
function render(){
 $('certs').innerHTML=data.certificates.map((x,i)=>`<div class="item">
 <div class="row"><div><label>Judul</label><input value="${esc(x.title)}" oninput="data.certificates[${i}].title=this.value"></div>
 <div><label>URL gambar</label><input value="${esc(x.image)}" oninput="data.certificates[${i}].image=this.value"></div></div>
 <label>URL saat diklik (opsional)</label><input value="${esc(x.url||'')}" oninput="data.certificates[${i}].url=this.value">
 <label><input type="checkbox" ${x.featured?'checked':''} onchange="data.certificates[${i}].featured=this.checked" style="width:auto"> Tampilkan sebagai sertifikat utama</label>
 <br>${x.image?`<img class="preview" src="${esc(x.image)}" onerror="this.style.display='none'">`:''}<br>
 <button class="danger" onclick="delCert(${i})">Hapus</button></div>`).join('') || '<p class="muted">Belum ada sertifikat.</p>';
 $('news').innerHTML=data.news.map((x,i)=>`<div class="item">
 <label>Judul berita</label><input value="${esc(x.title)}" oninput="data.news[${i}].title=this.value">
 <div class="row"><div><label>Sumber media</label><input value="${esc(x.source||'')}" oninput="data.news[${i}].source=this.value"></div>
 <div><label>URL berita</label><input value="${esc(x.url)}" oninput="data.news[${i}].url=this.value"></div></div>
 <button class="danger" onclick="delNews(${i})">Hapus</button></div>`).join('') || '<p class="muted">Belum ada berita.</p>';
}
function addCert(){data.certificates.push({title:'Sertifikat Baru',image:'',url:'',featured:false});render()}
function addNews(){data.news.push({title:'Berita Baru',source:'',url:''});render()}
function delCert(i){if(confirm('Hapus sertifikat ini?')){data.certificates.splice(i,1);render()}}
function delNews(i){if(confirm('Hapus berita ini?')){data.news.splice(i,1);render()}}
async function saveAll(){try{$('status').textContent='Menyimpan ke GitHub...';await api('/api/content',{method:'PUT',body:JSON.stringify(data)});$('status').textContent='Berhasil disimpan. Vercel akan men-deploy perubahan otomatis.'}catch(x){$('status').textContent=x.message}}
async function logout(){await api('/api/logout',{method:'POST'});location.reload()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
(async()=>{try{await api('/api/content');$('login').style.display='none';$('app').style.display='block';await load()}catch(e){}})();
</script></body></html>
